# 发布流程: 打 v* tag -> 校验 tag 递增 (vN 必须存在 vN-1) -> 生成 commit message 更新日志 -> 打包 APK -> 本仓库创建 Release (正文=changelog) -> 同步发布到 LSPosed 模块仓库 (tag 固定为 VersionCode-VersionName, 正文=changelog)
# Release 正文最顶部固定一行适配版本下载指引 (两个仓库的 Release 均生效), 见 doc/Release适配版本下载指引.md
name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号取自最近 v* tag + tag 递增校验需要全量历史与全部 tags
          fetch-depth: 0

      # 硬校验: tag 必须为 v<纯数字>, 且 vN 必须存在前置 tag v(N-1) (v1 除外),
      # 不满足直接失败, 不进入打包环节
      - name: Validate tag sequence
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag 必须为 v<纯数字> 格式 (如 v1、v2), 收到: $TAG"; exit 1 ;;
          esac
          N="${TAG#v}"
          if [ "$N" -gt 1 ] && ! git rev-parse -q --verify "refs/tags/v$((N-1))" >/dev/null; then
            echo "::error::缺少前置 tag v$((N-1)), 禁止跳号发布 (当前 $TAG)"
            exit 1
          fi
          echo "tag 校验通过: $TAG (版本号 $N)"

      # 生成基于 commit message 的更新日志:
      # vN 相对 v(N-1) 的全部提交 (v1 无前置 tag 时为全量历史),
      # 本仓库 Release 与 LSPosed 仓库 Release 正文共用这一份 changelog。
      # 正文第一行固定为适配版本下载指引, 置顶显示 (在 changelog 之前)
      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          HOST_LINE: 适配红果版本7.2.5.32, [点击下载](https://m.wandoujia.com/apps/8396801/history_v72532)
        run: |
          N="${TAG#v}"
          if [ "$N" -gt 1 ] && git rev-parse -q --verify "refs/tags/v$((N-1))" >/dev/null; then
            RANGE="v$((N-1))..${TAG}"
          else
            RANGE="${TAG}"
          fi
          LOG=$(git log "${RANGE}" --no-decorate --pretty=format:"- %h %s")
          if [ -z "$LOG" ]; then
            LOG="- 无新增提交 (重新发布)"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$HOST_LINE"
            echo ""
            echo "## 更新日志"
            echo ""
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "changelog 预览:"
          echo "$HOST_LINE"
          echo "$LOG"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (含缓存)
        uses: gradle/actions/setup-gradle@v4

      # 配置了签名 secrets 时构建 release 包, 否则回退 debug 包 (CI debug key 签名, 可安装)
      - name: Prepare signing (optional)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci-release.jks"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/ci-release.jks"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "gradle_task=:app:assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: ./gradlew ${{ steps.sign.outputs.gradle_task }}

      - name: Collect APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp "${{ steps.sign.outputs.apk_path }}" "dist/HongGuoEnhance-${TAG}.apk"
          ls -l dist/

      # 硬校验: versionCode = 最近 v* tag 数字, 理论上恒等于 tag; 不一致说明构建环境异常, 阻断发布
      - name: Verify versionCode matches tag
        run: |
          VCODE=$(grep '^versionCode=' app/build/generated/moduleProp/META-INF/xposed/module.prop | cut -d= -f2)
          TAG_NUM="${GITHUB_REF_NAME#v}"
          if [ "$TAG_NUM" != "$VCODE" ]; then
            echo "::error::APK 内 versionCode=${VCODE} 与 tag ${GITHUB_REF_NAME} 不一致"
            exit 1
          fi
          echo "versionCode=$VCODE 与 tag 一致"

      # Release 正文 = 置顶适配版本下载指引 + commit message 更新日志
      - name: Create Release (this repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" dist/HongGuoEnhance-*.apk \
            || { echo "Release 已存在, 覆盖上传资源并刷新正文"; gh release upload "$TAG" --clobber dist/HongGuoEnhance-*.apk; gh release edit "$TAG" --notes "$NOTES"; }

      # 同步发布到 LSPosed 模块仓库 (只放 release/readme, 不放代码)
      # 前提: 仓库变量 LSPOSED_REPO = LSPosed 模块仓库的 owner/name; secret LSPOSED_TOKEN = 对其有写权限的 PAT
      # 注意: LSPosed 仓库的 Release tag 必须为 VersionCode-VersionName (如 15-15),
      #       直接用 v15 会被 bot 判定无效; Release 标题 = 版本名, 正文与主仓库一致 (置顶指引 + changelog)
      - name: Publish Release to LSPosed module repo
        if: ${{ vars.LSPOSED_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_TOKEN }}
          LSPOSED_REPO: ${{ vars.LSPOSED_REPO }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          VCODE=$(grep '^versionCode=' app/build/generated/moduleProp/META-INF/xposed/module.prop | cut -d= -f2)
          VNAME=$(grep '^version=' app/build/generated/moduleProp/META-INF/xposed/module.prop | cut -d= -f2)
          LSTAG="${VCODE}-${VNAME}"
          echo "LSPosed release tag: $LSTAG (versionCode=$VCODE, versionName=$VNAME)"
          # 兼容历史错误 tag (vN): 删除旧格式 release 及其 tag, 重建为 VersionCode-VersionName
          if gh release view "$TAG" --repo "$LSPOSED_REPO" >/dev/null 2>&1; then
            echo "发现旧格式 release $TAG, 删除重建"
            gh release delete "$TAG" --repo "$LSPOSED_REPO" --yes --cleanup-tag
          fi
          if ! gh release view "$LSTAG" --repo "$LSPOSED_REPO" >/dev/null 2>&1; then
            gh release create "$LSTAG" --repo "$LSPOSED_REPO" --title "$VNAME" --notes "$NOTES" \
              dist/HongGuoEnhance-*.apk
          else
            # 官方注意: 仅覆盖资产不会触发 bot 更新 tag/版本; 需更新版本信息时应编辑 release 正文或删除重建
            gh release upload "$LSTAG" --repo "$LSPOSED_REPO" --clobber dist/HongGuoEnhance-*.apk
            gh release edit "$LSTAG" --repo "$LSPOSED_REPO" --notes "$NOTES"
          fi
